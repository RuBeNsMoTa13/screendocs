# Pushing a version tag (git tag v0.2.0 && git push --tags) creates a GitHub Release
# with screendocs.mcpb, the Claude Desktop installer. The latest one is always at
# https://github.com/RuBeNsMoTa13/screendocs/releases/latest/download/screendocs.mcpb
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build:mcpb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/screendocs.mcpb --title "$GITHUB_REF_NAME" --generate-notes
