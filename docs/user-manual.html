<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual do ScreenDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: sticky header with the language switch, a left index on wide screens, and the manual as a column of
   explanation + terminal pairs. Terminal frames are always dark, like a real terminal. Rubens Crimson accent. */
:root {
  --bg: #faf8f8;
  --surface: #ffffff;
  --fg: #1c1717;
  --muted: #6b6161;
  --line: #e7dfdf;
  --accent: #c81818;
  --accent-soft: #fbe9e9;
  --term-bg: #121010;
  --term-fg: #e8e2e2;
  --term-dim: #8a8080;
  --term-bar: #4d4545;
  --term-red: #e11d1d;
  --term-red2: #f05252;
  --term-yellow: #e6b450;
  --term-blue: #6cb6ff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0b0b; --surface: #171313; --fg: #efe9e9; --muted: #a59a9a; --line: #2c2525;
    --accent: #f04545; --accent-soft: #2a1414; --term-bg: #070606; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0b0b; --surface: #171313; --fg: #efe9e9; --muted: #a59a9a; --line: #2c2525;
  --accent: #f04545; --accent-soft: #2a1414; --term-bg: #070606; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.langs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button { font: 600 13px var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.langs button:focus-visible, a:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hero { padding-block: 48px 32px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; }
.hero > * { min-width: 0; }
.eyebrow { font: 600 12px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5.5vw, 56px); line-height: 1.02; letter-spacing: -0.03em; margin: 8px 0 16px; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); max-width: 52ch; margin: 0; }
.notice a { color: var(--accent); }
.notice { margin-top: 16px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); font-size: 14px; max-width: 60ch; }

.layout { display: grid; grid-template-columns: 200px 1fr; gap: 40px; padding-block: 8px 64px; }
.layout > * { min-width: 0; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; font-size: 14px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: t; }
nav.toc li { counter-increment: t; }
nav.toc a { display: flex; gap: 10px; padding: 6px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; }
nav.toc a::before { content: counter(t); font: 700 12px var(--font-mono); color: var(--accent); min-width: 14px; padding-top: 2px; }
nav.toc a:hover { background: var(--surface); color: var(--fg); }

section.part { padding-block: 28px; border-top: 1px solid var(--line); scroll-margin-top: 72px; }
section.part:first-child { border-top: 0; padding-top: 0; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 6px; letter-spacing: -0.01em; }
p { margin: 0 0 12px; max-width: 66ch; }
.intro { color: var(--muted); }
code, kbd { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--surface); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); padding: 1px 7px; border-radius: 5px; font-weight: 700; }

.cmd { display: flex; align-items: center; gap: 8px; background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 12px 12px 12px 16px; font: 14px var(--font-mono); margin: 10px 0 14px; max-width: 640px; }
.cmd .t { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
.cmd .t::before { content: "$ "; color: var(--term-red); }
.copy { font: 600 12px var(--font-body); border: 1px solid var(--term-bar); background: transparent; color: var(--term-fg); padding: 5px 10px; border-radius: 6px; cursor: pointer; flex: none; }
.copy:hover { border-color: var(--term-red); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
.two > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card p:last-child { margin-bottom: 0; }
.tag { display: inline-block; font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

.step { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 24px; padding-block: 22px; border-top: 1px dashed var(--line); align-items: start; }
.step:first-of-type { border-top: 0; }
.step .n { font: 700 12px var(--font-mono); color: var(--accent); margin-bottom: 4px; }
.when { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; margin-bottom: 8px; }

pre.term { margin: 0; background: var(--term-bg); color: var(--term-fg); border-radius: 12px; padding: 16px 18px; font: 13px/1.55 var(--font-mono); overflow-x: auto; white-space: pre; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 30px -18px rgba(0,0,0,.5); }
pre.term .chrome { display: block; margin: -4px 0 10px; }
pre.term .chrome i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--term-bar); margin-right: 5px; }
.term .r { color: var(--term-red); } .term .r2 { color: var(--term-red2); } .term .d { color: var(--term-dim); }
.term .b { color: var(--term-bar); } .term .y { color: var(--term-yellow); } .term .bl { color: var(--term-blue); }
.term .w { font-weight: 700; color: #fff; } .term .pill { background: var(--term-red); color: #fff; font-weight: 700; }
.term .cur { background: var(--term-fg); color: var(--term-bg); }
.term .u { text-decoration: underline; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-top: 12px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 600 12px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td:first-child { white-space: nowrap; }
td code { background: transparent; border: 0; padding: 0; color: var(--accent); }

.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.keys div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; }
.keys kbd { margin-bottom: 6px; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
.opts .card { display: flex; flex-direction: column; gap: 4px; }
.opts .card h3 { margin: 0; }
.opts .card code { align-self: flex-start; }

.tree { margin-top: 12px; }
.tree .f { color: var(--term-red2); }
footer { border-top: 1px solid var(--line); padding-block: 24px 40px; color: var(--muted); font-size: 14px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.toc { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); padding-block: 28px 16px; }
  .step { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}
@media (max-width: 640px) {
  .two, .opts { grid-template-columns: minmax(0, 1fr); }
  pre.term { font-size: 12px; padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* site mapping */
h3.sub { font-size: 21px; margin: 26px 0 8px; }
.flow { list-style: none; padding: 0; margin: 16px 0 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: f; }
.flow li { counter-increment: f; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.flow li::before { content: counter(f); font: 700 11px var(--font-mono); color: var(--accent); }
.flow li b { font-size: 13.5px; line-height: 1.25; }
.flow li span { color: var(--muted); line-height: 1.35; }
.flow li.hot { border-color: var(--accent); background: var(--accent-soft); }
.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -8px; top: 50%; transform: translate(50%, -50%); color: var(--muted); font-size: 13px; z-index: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; font-size: 13px; }
.crawl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; overflow-x: auto; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.lvl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lvl-h { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.node { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; border-radius: 8px; padding: 6px 9px; font-size: 13px; border: 1px solid var(--line); background: var(--bg); }
.lvl .node { display: flex; }
.node .m { font: 700 12px var(--font-mono); }
.node .p { font: 13px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.node .w { flex-basis: 100%; font-size: 12px; color: var(--muted); padding-left: 17px; }
.node.ok { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.node.ok .m { color: var(--accent); }
.node.same .m { color: var(--muted); }
.node.no { opacity: 0.72; border-style: dashed; }
.node.no .p { text-decoration: line-through; text-decoration-color: var(--muted); }
.node.no .m { color: var(--muted); }
.cap { font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
.rules ul, .cutrules { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.rules li, .cutrules li { max-width: 72ch; }
.cut { display: grid; grid-template-columns: 200px 200px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 12px; }
.mock-h { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.browser { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.bar3 i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); margin: 0 3px 2px 0; }
.blk { border: 1.5px solid var(--accent); border-radius: 5px; background: var(--accent-soft); display: flex; justify-content: space-between; align-items: center; padding: 0 8px; font-size: 11.5px; }
.blk span { color: var(--fg); } .blk b { font: 700 11px var(--font-mono); color: var(--accent); }
.blk.sl { border-style: dashed; background: transparent; }
/* flags */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.chips a { text-decoration: none; }
.chips code { color: var(--accent); }
.flags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.flag { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; scroll-margin-top: 80px; }
.flag p { font-size: 14.5px; margin-bottom: 4px; }
.flag .cmd { margin: 8px 0 6px; font-size: 12.5px; }
.flag .cmd .t { white-space: normal; overflow-wrap: anywhere; }
.fh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 10px; margin-bottom: 6px; }
.fn { font-size: 15px !important; font-weight: 700; color: var(--accent); background: transparent !important; border: 0 !important; padding: 0 !important; }
.def { font-size: 12px; color: var(--muted); }
.cfg { font-size: 12.5px; color: var(--muted); }
.note { font-size: 13px !important; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 8px; margin-top: 6px; }
.env { margin: 0; display: grid; gap: 2px 0; }
.env dt { margin-top: 8px; } .env dd { margin: 0; color: var(--muted); font-size: 14px; }
.win { margin-top: 14px; } .win ol { margin: 0; padding-left: 20px; }
.rank { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.rank li:first-child { font-weight: 600; }
.sec-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; }
.sec-list li { max-width: 70ch; }
.where { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; }
.where dt { font-weight: 600; } .where dd { margin: 0; color: var(--muted); }
.guard h3 { display: flex; gap: 8px; align-items: baseline; }
.guard .m { font: 700 15px var(--font-mono); }
.guard.yes { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.guard.yes .m { color: var(--accent); }
.guard.no { border-style: dashed; }
.guard.no .m { color: var(--muted); }
@media (max-width: 640px) { .where { grid-template-columns: minmax(0, 1fr); } .where dd { margin-bottom: 4px; } }
@media (max-width: 1100px) { .flow { grid-template-columns: repeat(4, minmax(0, 1fr)); } .flow li::after { display: none; } }
@media (max-width: 900px) { .crawl { grid-template-columns: repeat(4, minmax(170px, 1fr)); } .cut { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cutrules { grid-column: 1 / -1; } }
@media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flags { grid-template-columns: minmax(0, 1fr); } }

.layers { list-style: none; margin: 14px 0 10px; padding: 0; display: grid; gap: 8px; }
.layers li { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.layers li:first-child { border-color: var(--accent); }
.layers .ln { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft, rgba(127,127,127,.12)); font-weight: 700; font-size: 14px; }
.layers li:first-child .ln { background: var(--accent); color: #fff; }
.layers .lt { display: grid; gap: 2px; min-width: 0; }
.layers .lt span { color: var(--muted); font-size: 14px; }
.layers .lt code { justify-self: start; font-size: 12.5px; overflow-wrap: anywhere; }
.layers .lv { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.layers li:first-child .lv { color: var(--accent); }
.card.dev { border-style: dashed; }
.card.dev a, .part a { color: var(--accent); }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Screen<span>Docs</span></div>
    <div class="langs" role="group" aria-label="Idioma / Language / Idioma">
      <button type="button" id="lang-pt" data-lang="pt" aria-pressed="true">PT</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" id="lang-es" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
/* ---------- terminal frame helpers (mimic @clack/prompts as ScreenDocs draws it) ---------- */
const B = '<span class="b">│</span>';
const bar = (s = "") => (s ? `${B}  ${s}` : B);
const active = (msg) => `<span class="r">◆</span>  ${msg}`;
const doneQ = (msg, ans) => [`<span class="r2">◇</span>  ${msg}`, bar(`<span class="d">${ans}</span>`), B];
const opt = (label, on, hint) => bar(`${on ? '<span class="r">●</span>' : '<span class="d">○</span>'} ${on ? label : `<span class="d">${label}</span>`}${hint && on ? ` <span class="d">(${hint})</span>` : ""}`);
const end = (h) => `<span class="b">└</span>  <span class="d">${h}</span>`;
const confirm = (y, n, yesOn = true) => bar(`${yesOn ? '<span class="r">●</span> ' + y : '<span class="d">○ ' + y + "</span>"} <span class="d">/</span> ${!yesOn ? '<span class="r">●</span> ' + n : '<span class="d">○ ' + n + "</span>"}`);
const input = (val, ph) => bar(val ? `${val}<span class="cur"> </span>` : `<span class="cur">${ph[0]}</span><span class="d">${ph.slice(1)}</span>`);
const frame = (lines) => `<pre class="term"><span class="chrome"><i></i><i></i><i></i></span>${lines.join("\n")}</pre>`;

const SMALL = String.raw`  ____                           ____
 / ___|  ___ _ __ ___  ___ _ __ |  _ \  ___   ___ ___
 \___ \ / __| '__/ _ \/ _ \ '_ \| | | |/ _ \ / __/ __|
  ___) | (__| | |  __/  __/ | | | |_| | (_) | (__\__ \
 |____/ \___|_|  \___|\___|_| |_|____/ \___/ \___|___/`;

  noNote: "Essa limitação vale para todo programa que guarda senha sem pedir uma senha mestra, inclusive os navegadores e o Gerenciador de Credenciais do Windows. A defesa é impedir que esse programa chegue a rodar.",
  tipsH: "Boas práticas",
  tips: ["Crie uma chave só para o ScreenDocs, com limite de gasto no painel do provedor (Google AI Studio, OpenAI, Anthropic...). Se algo der errado, o estrago fica pequeno.", "Se não usa sempre, não guarde: deixe o Não marcado e digite a chave quando precisar.", "Desconfiou de algo? Apague a chave no painel do provedor. A antiga para de funcionar na hora. Depois rode <code>keys remove</code>.", "Instale só pacotes confiáveis e mantenha o antivírus ligado.", "Com Ollama ou LM Studio não existe chave, e as fotos não saem do computador."],
  authH: "2. Login dos sites",
  authP: "O <code>npx screendocs login</code> guarda a sessão de cada site num arquivo na sua pasta de usuário, que só o seu usuário consegue ler. Esse arquivo dá acesso à sua conta no site, do mesmo jeito que um navegador já logado. Ele não é criptografado: quem copiar o arquivo, ou usar a sua conta neste computador, entra no site como você. Por isso nunca mande esse arquivo para ninguém.",
  auth: ["Nada do login fica na pasta onde você roda o comando, então ele não vai junto se você mandar essa pasta para alguém.", "Para sair, rode <code>npx screendocs login</code> de novo ou saia da conta pelo próprio site.", "Em painéis de clientes, prefira uma conta de teste, sem dados reais."],
  shotsH: "3. Fotos e vídeos das telas",
  shotsP: "E-mails, telefones, cartões, documentos (CPF/CNPJ, SSN, DNI, CURP, IBAN...) e campos preenchidos são borrados na página antes de cada foto e durante o vídeo, e trocados por ••• no texto salvo. Mas o borrão procura padrões e pode deixar passar algo, como um nome ou um valor.",
  shots: ["Confira as fotos e os vídeos antes de publicar ou mandar para alguém.", "Use <code>--mask</code> para borrar o que o ScreenDocs não reconhece sozinho, como <code>.nome-cliente</code> ou <code>#saldo</code>.", "Quando uma IA descreve, as fotos vão para ela: para o provedor da API, para o chat no navegador ou para a ferramenta instalada. Com Ollama ou LM Studio, elas ficam no seu computador."],
  padH: "Seus padrões e o idioma",
  cfgIntro: "Os seus padrões são as escolhas que valem sempre, em qualquer pasta onde você rodar o ScreenDocs: o idioma, quantas páginas procurar, se grava vídeo, quem descreve as telas e o resto. Você escolhe com <code>npx screendocs config</code> e eles ficam salvos no seu computador, na sua pasta de usuário. Continuam lá quando o ScreenDocs atualiza.",
  cfgMenuH: "O menu de padrões",
  cfgMenuP: "<code>npx screendocs config</code> abre uma lista com cada configuração e o valor que ela tem agora. Escolha uma, mude, e repita até escolher Pronto. Os valores em cinza são os padrões do próprio ScreenDocs.",
  cfgCmdH: "Pelo terminal, sem menu",
  cfgCmds: [["config list", "mostra o que está guardado"], ["config set maxPages 40", "guarda um valor"], ["config unset maxPages", "volta um valor ao padrão"], ["config reset", "apaga tudo (o idioma é perguntado de novo)"], ["config path", "mostra onde fica o arquivo"]],
  langH: "Dois idiomas diferentes",
  langP: "<b>O idioma do terminal</b> é o que o ScreenDocs usa para falar com você. Ele pergunta só na primeira vez que você roda e depois fica salvo. Para trocar, rode <code>npx screendocs config</code> e escolha <i>Idioma do screendocs</i>; vale para todas as próximas vezes.<br><br><b>O idioma das descrições</b> é o que a IA usa para escrever. É esse que o menu pergunta toda vez. Se você não escolher, é o mesmo do terminal. Para trocar só numa vez, use <code>--lang en</code> no comando; para sempre, escolha <i>Idioma das descrições</i> no mesmo menu.",
  tipNone: "<b>Uma vez sem IA.</b> Se você salvou nos seus padrões uma IA para descrever, ela é usada em toda execução. Para uma vez sair só com as capturas, acrescente <code>--describe none</code> no comando. Na próxima vez, a IA volta.", layH: "Quem vale mais: pense em camadas", layP: "Uma opção pode vir de quatro lugares, um por cima do outro. Quando dois dizem coisas diferentes, vale o de cima.", layers: [["O comando", "O que você digita agora. Vale só nesta vez.", "--max-pages 5", "5"], ["Opções da pasta (opcional)", "Um <code>screendocs.config.json</code> na pasta onde você roda. Vale só ali.", "\"maxPages\": 10", "10"], ["Seus padrões", "O que você salvou com <code>npx screendocs config</code>. Vale em qualquer pasta.", "config set maxPages 40", "40"], ["Padrão do ScreenDocs", "O que já vem no pacote.", "", "20"]], layEx: "<b>Exemplo com o número de páginas.</b> Em qualquer pasta ele procura 40, porque você salvou 40. Na pasta <code>cliente-x</code>, que tem um arquivo dizendo 10, ele procura 10. Se ali você digitar <code>--max-pages 5</code>, ele procura 5, só desta vez.", layTip: "Na prática, quase todo mundo usa só duas camadas: salva o que quer sempre com <code>npx screendocs config</code> e muda uma vez com uma flag no comando.", filesH: "O que fica no seu computador", runH: "Na pasta onde você roda o comando", run: [["screendocs-output/", "As fotos, os vídeos e o relatório, uma pasta por site. É a única coisa que o ScreenDocs cria aqui."]], homeH: "Na sua pasta de usuário", home: [["Seus padrões", "Tudo o que você salvou com <code>npx screendocs config</code>, inclusive o idioma. <code>npx screendocs config path</code> mostra onde."], ["Logins dos sites", "Um arquivo por site, salvo pelo <code>npx screendocs login</code>. Nunca compartilhe."], ["Chaves de API", "Só se você escolheu guardar, e só quando o sistema não tem cofre de senhas. Veja <a href=\"#seguranca\">Segurança</a>."]], filesNote: "O ScreenDocs nunca cria o <code>screendocs.config.json</code>. Ele só lê esse arquivo, se você criar um.", devH: "Vai rodar pelo código do GitHub?", devP: "Este manual é para quem usa pelo npm. Para baixar o código do GitHub, rodar o ScreenDocs a partir dele ou mandar uma correção, veja o <a href=\"https://github.com/RuBeNsMoTa13/screendocs/blob/main/CONTRIBUTING.pt-BR.md\">guia para desenvolvedores</a>.",
  mapH: "Como o site é mapeado",

      ["--model <provedor/modelo>", "", "A única flag de API: descreve com o modelo escolhido, que precisa ler imagens. O provedor vem sempre na frente: openai/gpt-4o-mini, gemini/gemini-2.5-flash, anthropic/claude-sonnet-4-5, openrouter/…, ollama/llama3.2-vision ou lmstudio/… (os dois últimos rodam no seu PC, sem chave). A chave vem da variável do provedor ou do screendocs keys set.", "--model gemini/gemini-2.5-flash", "\"model\": \"gemini/gemini-2.5-flash\"", "Não combina com --describe claude, codex, antigravity ou chat: é um ou outro. Para outro servidor compatível com OpenAI, defina OPENAI_BASE_URL com o endereço e use --model openai/<modelo>."],

Object.assign(L.en.u, {
  secH: "Security",
  secIntro: "ScreenDocs handles three sensitive things: the AI's API key, the sites' logins and the screenshots. This section says where each one lives, what protects it and what is up to you.",
  keyH: "1. API key",
  keyP: "By default the key only lasts for that run: when ScreenDocs asks for the key, “Save it for next time?” comes with No selected. The key never goes in the command or in an options file, and it is not kept in the folder where you run the command. So it does not show in your terminal history and does not go along if you send that folder to someone. Before the capture, it is tested with the provider: if you mistyped it, it asks again right away, and if a saved or environment key is rejected, it says where that key came from and asks for a new one. The key is looked up in this order: the provider's variable (<code>GEMINI_API_KEY</code>, <code>OPENAI_API_KEY</code>...), then <code>SCREENDOCS_API_KEY</code>, then the saved key.",
  whereH: "Where a saved key lives",
  where: [["macOS", "The system Keychain, the same store as Safari's passwords."], ["Windows", "A file in your user folder, encrypted with your Windows account. Only your account, on this computer, can open it."], ["Linux", "The system keyring (<code>secret-tool</code>)."], ["None of these", "A file in your user folder (<code>keys.json</code>) readable only by your user."]],
  whereNote: "<code>npx screendocs keys list</code> shows where each key is, and <code>keys remove &lt;provider&gt;</code> deletes one.",
  yesH: "Protects against",
  yes: ["Someone who only reads the file: they see scrambled text, not the key.", "An AI or tool that opens the key file.", "A backup or copy of the file that leaks.", "Another person using the same computer with another account.", "Taking the file to another computer."],
  noH: "Does not protect against",
  no: ["A malicious program running under your account, like an infected npm package or a virus. It can ask the system to open the key the same way ScreenDocs does.", "An AI you allowed to run commands that decides to do so."],
  noNote: "This limit applies to every program that saves passwords without asking for a master password, browsers and the Windows Credential Manager included. The defense is to keep such a program from running at all.",
  tipsH: "Good practices",
  tips: ["Create a key just for ScreenDocs, with a spending limit in the provider's dashboard (Google AI Studio, OpenAI, Anthropic...). If something goes wrong, the damage stays small.", "If you do not use it often, do not save it: leave No selected and type the key when you need it.", "Suspect something? Delete the key in the provider's dashboard. The old one stops working at once. Then run <code>keys remove</code>.", "Install only trusted packages and keep your antivirus on.", "With Ollama or LM Studio there is no key, and the screenshots never leave your computer."],
  authH: "2. Site logins",
  authP: "<code>npx screendocs login</code> saves each site's session to a file in your user folder that only your user can read. That file gives access to your account on the site, like a browser that is already logged in. It is not encrypted: anyone who copies the file, or uses your account on this computer, gets into the site as you. So never send that file to anyone.",
  auth: ["Nothing from the login stays in the folder where you run the command, so it does not go along if you send that folder to someone.", "To log out, run <code>npx screendocs login</code> again or log out on the site itself.", "On customer dashboards, prefer a test account without real data."],
  shotsH: "3. Screenshots and videos",
  shotsP: "Emails, phones, cards, documents (CPF/CNPJ, SSN, DNI, CURP, IBAN...) and filled fields are blurred on the page before each screenshot and during the video, and replaced with ••• in the saved text. But the blur looks for patterns and can miss something, like a name or an amount.",
  shots: ["Check the screenshots and videos before publishing or sending them to anyone.", "Use <code>--mask</code> to blur what ScreenDocs does not recognize on its own, like <code>.customer-name</code> or <code>#balance</code>.", "When an AI describes, the screenshots go to it: to the API provider, to the browser chat or to the installed tool. With Ollama or LM Studio they stay on your computer."],
  padH: "Your defaults and language",
  cfgIntro: "Your defaults are the choices that always apply, in any folder where you run ScreenDocs: the language, how many pages to look for, whether to record video, who describes the screens and the rest. You pick them with <code>npx screendocs config</code> and they are saved on your computer, in your user folder. They stay there when ScreenDocs updates.",
  cfgMenuH: "The defaults menu",
  cfgMenuP: "<code>npx screendocs config</code> opens a list with each setting and its current value. Pick one, change it, and repeat until you choose Done. Grey values are ScreenDocs' own defaults.",
  cfgCmdH: "From the terminal, without the menu",
  cfgCmds: [["config list", "shows what is saved"], ["config set maxPages 40", "saves a value"], ["config unset maxPages", "puts a value back to its default"], ["config reset", "erases everything (the language is asked again)"], ["config path", "shows where the file is"]],
  langH: "Two different languages",
  langP: "<b>The terminal language</b> is the one ScreenDocs uses to talk to you. It only asks the first time you run it, then it stays saved. To change it, run <code>npx screendocs config</code> and pick <i>Language of screendocs</i>; it applies from then on.<br><br><b>The description language</b> is the one the AI writes in. This is the one the menu asks every time. If you do not pick one, it is the same as the terminal. To change it for one run, add <code>--lang pt</code> to the command; to change it for good, pick <i>Language of the descriptions</i> in the same menu.",
  tipNone: "<b>One run without AI.</b> If you saved an AI in your defaults, it is used on every run. To get only the captures one time, add <code>--describe none</code> to the command. Next time, the AI is back.", layH: "What wins: think in layers", layP: "An option can come from four places, one on top of the other. When two say different things, the one on top wins.", layers: [["The command", "What you type now. Applies to this run only.", "--max-pages 5", "5"], ["Folder options (optional)", "A <code>screendocs.config.json</code> in the folder where you run it. Applies only there.", "\"maxPages\": 10", "10"], ["Your defaults", "What you saved with <code>npx screendocs config</code>. Applies in every folder.", "config set maxPages 40", "40"], ["ScreenDocs' default", "What comes in the package.", "", "20"]], layEx: "<b>Example with the number of pages.</b> In any folder it looks for 40, because you saved 40. In the <code>client-x</code> folder, which has a file saying 10, it looks for 10. If you type <code>--max-pages 5</code> there, it looks for 5, this time only.", layTip: "In practice, almost everyone uses just two layers: save what you always want with <code>npx screendocs config</code> and change one run with a flag on the command.", filesH: "What it leaves on your computer", runH: "In the folder where you run the command", run: [["screendocs-output/", "The screenshots, videos and report, one folder per site. It is the only thing ScreenDocs creates here."]], homeH: "In your user folder", home: [["Your defaults", "Everything you saved with <code>npx screendocs config</code>, the language included. <code>npx screendocs config path</code> shows where."], ["Site logins", "One file per site, saved by <code>npx screendocs login</code>. Never share them."], ["API keys", "Only if you chose to save one, and only when the system has no password store. See <a href=\"#seguranca\">Security</a>."]], filesNote: "ScreenDocs never creates <code>screendocs.config.json</code>. It only reads that file, if you create one.", devH: "Running it from the GitHub code?", devP: "This manual is for people who use it from npm. To download the code from GitHub, run ScreenDocs from it or send a fix, see the <a href=\"https://github.com/RuBeNsMoTa13/screendocs/blob/main/CONTRIBUTING.md\">developer guide</a>.",
  mapH: "How the site is mapped",
  mapP: "From the address to the report, ScreenDocs goes through these stages. Finding the pages and cutting them into sections are what decide what ends up in the report.",
  flow: [
    ["Checks the address", "Makes sure the site answers and suggests fixes."],
    ["Loads the login", "Uses the saved session and warns if it expired."],
    ["Finds the pages", "Follows the links, level by level."],
    ["Captures each page", "On each screen: scrolls, films and cuts into sections."],
    ["Blurs personal data", "In screenshots, video and saved text."],
    ["Builds the report", "index.html, screens.json and for-ai/."],
    ["AI describes (optional)", "A title and description for each screen."],
  ],
  bfsH: "1. Finding the pages",
  bfsP: "It opens the home page (level 0), collects all its links and visits each one (level 1), then their links (level 2), and so on. This is a breadth-first search: pages closer to the home page come first. It stops when it reaches <code>--max-pages</code> pages (20) or when there are no more links up to level <code>--depth</code> (3). Links found on the last level are not followed.",
  lvl: (n, last) => (n === 0 ? "Level 0 · home page" : `Level ${n}${last ? " · last (--depth 3)" : ""}`),
  legend: [["ok", "becomes a screen in the report"], ["same", "already in the report"], ["no", "left out"]],
  why: {
    logout: "logout link", file: "a file, not a page", other: "another site", sub: "a subdomain counts as another site",
    query: "it is /blog: everything after ? is ignored", id: "numbers and codes become :id → /blog/:id", sameId: "same screen as /blog/12",
    excl: "--exclude /admin", login: "only shows up with the saved login", redirect: "redirects to /login, already seen", noFollow: "links on this page are not followed",
  },
  rulesH: "Rules for the whole search",
  rules: [
    "<b>Same site:</b> <code>mysite.com</code> and <code>www.mysite.com</code> count as one. Subdomains (<code>app.</code>, <code>blog.</code>) and other domains are left out; to capture a subdomain, run ScreenDocs on it.",
    "<b>No repeated screens:</b> path parts that are numbers or long codes become <code>:id</code>, so <code>/blog/12</code> and <code>/blog/13</code> count as one screen.",
    "<b>Clean addresses:</b> everything after <code>?</code> and <code>#</code> is ignored. The exception is apps with <code>#/</code> routes (like <code>#/dashboard</code>), which count as pages.",
    "<b>Always skipped:</b> logout links (logout, sign out, sair) and files (PDF, images, spreadsheets, ZIP...).",
    "<b>With a login:</b> the search uses the saved session, so pages behind the login show up like any other.",
    "<b>No search:</b> with <code>--pages</code> it captures only the listed paths, without following links.",
  ],
  cutH: "2. Cutting each page into sections",
  cutP: "On each page and each screen (desktop and mobile), it scrolls to the bottom to load images and animations, films that scroll, goes back to the top and looks for the page's big blocks. Each block becomes a numbered screenshot.",
  cutRules: [
    "Blocks it looks for: <code>header</code>, <code>section</code>, <code>article</code>, <code>footer</code>, <code>[data-section]</code> and the direct children of <code>main</code>.",
    "A block counts only if it is at least 1/4 of the screen tall and 60% of its width; blocks inside another block are not captured separately.",
    "A screenshot is at most 1.6 screens tall, and each page has at most 10 screenshots. The whole page is also saved as <code>full.jpg</code>.",
    "When the page has none of these blocks, it is cut into screen-sized slices.",
    "Each block's heading and first paragraph become the screen's first description, until an AI writes its own.",
  ],
  withBlocks: "Page with blocks", noBlocks: "Page without blocks",
  slice: "slice", full: "whole page",
  blocks: ["header", "section · hero", "section · pricing", "section · testimonials", "footer"],

  flagsH: "Flag guide",
  flagsP: "Type the flags after the address, in any order. Without any, your defaults apply. A flag applies to that run only and wins over any default (see <a href=\"#padroes\">What wins</a>).",
  defLabel: "Default", exLabel: "Example", cfgLabel: "In the file",
  groups: [
    ["Which pages", [
      ["--max-pages <n>", "20", "The most pages the search collects. It stops as soon as it reaches this number.", "--max-pages 50", "\"maxPages\": 50", "Each page gives up to 10 screenshots per screen, so 50 pages can mean over a thousand images."],
      ["--depth <n>", "3", "How many clicks away from the home page it looks. 1 takes only the home page's links.", "--depth 1", "\"depth\": 1", ""],
      ["--pages <a,b,c>", "", "Captures only these paths, without searching. Use it to hand-pick screens or for apps where the search cannot find the links.", "--pages /,/pricing,/dashboard", "\"pages\": [\"/\", \"/pricing\"]", "With --pages, --max-pages, --depth and --exclude do nothing."],
      ["--exclude <a,b>", "", "Skips addresses containing any of these texts. Links on those pages are not followed either.", "--exclude /admin,/checkout", "\"exclude\": [\"/admin\"]", ""],

    ["Screens and video", [
      ["--viewports <list>", "desktop,mobile", "Which screens to capture: desktop (1440×900), mobile (390×844, like a touch phone) or both.", "--viewports desktop", "\"viewports\": [\"desktop\"]", ""],
      ["--no-video", "", "Does not record the video scrolling each page. The capture is faster and the folder smaller. If your defaults turned video off, --video turns it back on for that run.", "--no-video", "\"video\": false", ""],

    ["Personal data", [
      ["--mask <selectors>", "", "Also blurs the elements matching these CSS selectors, on top of what is blurred automatically. Their text is also left out of the saved text.", "--mask .customer-name,#balance", "\"mask\": [\".customer-name\"]", ""],
      ["--no-auto-mask", "", "Does not blur emails, phones, documents, cards or filled fields, and the saved text keeps them instead of •••. Use only on sites without real data. If your defaults turned blurring off, --auto-mask turns it back on.", "--no-auto-mask", "\"autoMask\": false", ""],
    ]],
    ["Descriptions", [
      ["--describe <how>", "", "Who writes the descriptions: claude, codex, antigravity (an installed tool, uses your plan) or chat (a browser chat, guided in the terminal). To use an API, use --model. With neither, each screen keeps the page's text.", "--describe claude", "\"describe\": \"claude\"", "<b>none</b>: no AI this time only. Useful when your defaults already name an AI and you run straight from the command (<code>npx screendocs mysite.com --describe none</code>). In the menu you do not need it: just pick “Just the page scan for now”."],
      ["--model <provider/model>", "", "The only API flag: describes with the chosen model, which must read images. The provider always comes first: openai/gpt-4o-mini, gemini/gemini-2.5-flash, anthropic/claude-sonnet-4-5, openrouter/…, ollama/llama3.2-vision or lmstudio/… (the last two run on your computer, with no key). The key comes from the provider's variable or screendocs keys set.", "--model gemini/gemini-2.5-flash", "\"model\": \"gemini/gemini-2.5-flash\"", "It does not combine with --describe claude, codex, antigravity or chat: it is one or the other. For another OpenAI-compatible server, set OPENAI_BASE_URL to its address and use --model openai/<model>."],
      ["--instructions <text>", "", "What else the descriptions should take into account. Works with any AI (tool, chat or API).", "--instructions \"focus on what the customer gains\"", "\"instructions\": \"...\"", ""],
      ["--docs <path>", "", "A folder or one file with the project's documentation for the AI to read before describing. It reads md, txt, html, json, yaml, csv, PDF, Word, Excel, PowerPoint and OpenDocument.", "--docs ./manual.pdf", "\"docs\": \"./manual.pdf\"", ""],
      ["--lang <code>", "the language of screendocs", "The language the AI writes the descriptions in: pt, en or es. Without it, the same language ScreenDocs talks to you in.", "--lang es", "\"lang\": \"es\"", ""],
    ]],
    ["Folder and report", [
      ["--out <folder>", "screendocs-output", "Where to save. Each site gets a subfolder named after it.", "--out ./captures", "\"out\": \"./captures\"", ""],
      ["--keep", "", "Keeps the previous capture of the same site, renamed with its date, instead of replacing it. --no-keep replaces it when your defaults keep it.", "--keep", "\"keep\": true", ""],

      ["--headed", "", "Shows the browser window during the capture. Handy to see where something got stuck. --no-headed hides it again when your defaults show it.", "--headed", "\"headed\": true", ""],

Object.assign(L.es.u, {
  secH: "Seguridad",
  secIntro: "ScreenDocs maneja tres cosas sensibles: la clave de la API de la IA, la sesión de los sitios y las capturas de las pantallas. Esta sección dice dónde queda cada una, de qué está protegida y qué queda en tus manos.",
  keyH: "1. Clave de la API",
  keyP: "Por defecto la clave vale solo para esa ejecución: cuando ScreenDocs pide la clave, “¿Guardarla para la próxima vez?” viene marcado No. La clave nunca va en el comando ni en un archivo de opciones, y no queda en la carpeta donde ejecutas el comando. Así que no aparece en el historial de la terminal y no va junto si mandas esa carpeta a alguien. Antes de la captura, se prueba con el proveedor: si la escribiste mal, la pide de nuevo en el momento, y si una clave guardada o de variable es rechazada, dice de dónde vino y pide una nueva. La clave se busca en este orden: la variable del proveedor (<code>GEMINI_API_KEY</code>, <code>OPENAI_API_KEY</code>...), luego <code>SCREENDOCS_API_KEY</code>, luego la clave guardada.",
  whereH: "Dónde queda una clave guardada",
  where: [["macOS", "El Keychain del sistema, el mismo almacén de las contraseñas de Safari."], ["Windows", "Un archivo en tu carpeta de usuario, cifrado con tu cuenta de Windows. Solo tu cuenta, en esta computadora, puede abrirlo."], ["Linux", "El llavero del sistema (<code>secret-tool</code>)."], ["Sin ninguno de estos", "Un archivo en tu carpeta de usuario (<code>keys.json</code>) que solo tu usuario puede leer."]],
  whereNote: "<code>npx screendocs keys list</code> muestra dónde está cada clave, y <code>keys remove &lt;proveedor&gt;</code> la borra.",
  yesH: "Protege contra",
  yes: ["Quien solo lee el archivo: ve un código revuelto, no la clave.", "Una IA o herramienta que abra el archivo de la clave.", "Un respaldo o una copia del archivo que se filtre.", "Otra persona que use la misma computadora con otra cuenta.", "Llevar el archivo a otra computadora."],
  noH: "No protege contra",
  no: ["Un programa malicioso que corre con tu cuenta, como un paquete npm infectado o un virus. Puede pedirle al sistema que abra la clave igual que lo hace ScreenDocs.", "Una IA a la que diste permiso de ejecutar comandos y que decida hacerlo."],
  noNote: "Este límite vale para todo programa que guarda contraseñas sin pedir una contraseña maestra, incluidos los navegadores y el Administrador de credenciales de Windows. La defensa es impedir que ese programa llegue a ejecutarse.",
  tipsH: "Buenas prácticas",
  tips: ["Crea una clave solo para ScreenDocs, con límite de gasto en el panel del proveedor (Google AI Studio, OpenAI, Anthropic...). Si algo sale mal, el daño queda chico.", "Si no la usas seguido, no la guardes: deja el No marcado y escribe la clave cuando la necesites.", "¿Sospechas algo? Borra la clave en el panel del proveedor. La anterior deja de funcionar en el momento. Después ejecuta <code>keys remove</code>.", "Instala solo paquetes confiables y mantén el antivirus encendido.", "Con Ollama o LM Studio no hay clave, y las capturas no salen de tu computadora."],
  authH: "2. Sesión de los sitios",
  authP: "<code>npx screendocs login</code> guarda la sesión de cada sitio en un archivo de tu carpeta de usuario que solo tu usuario puede leer. Ese archivo da acceso a tu cuenta en el sitio, igual que un navegador con la sesión abierta. No está cifrado: quien copie el archivo, o use tu cuenta en esta computadora, entra al sitio como tú. Por eso nunca mandes ese archivo a nadie.",
  auth: ["Nada del inicio de sesión queda en la carpeta donde ejecutas el comando, así que no va junto si mandas esa carpeta a alguien.", "Para cerrar la sesión, ejecuta <code>npx screendocs login</code> de nuevo o ciérrala en el propio sitio.", "En paneles de clientes, prefiere una cuenta de prueba, sin datos reales."],
  shotsH: "3. Capturas y videos",
  shotsP: "Los correos, teléfonos, tarjetas, documentos (CPF/CNPJ, SSN, DNI, CURP, IBAN...) y campos completados se difuminan en la página antes de cada captura y durante el video, y se cambian por ••• en el texto guardado. Pero el difuminado busca patrones y puede dejar pasar algo, como un nombre o un monto.",
  shots: ["Revisa las capturas y los videos antes de publicarlos o mandarlos a alguien.", "Usa <code>--mask</code> para difuminar lo que ScreenDocs no reconoce solo, como <code>.nombre-cliente</code> o <code>#saldo</code>.", "Cuando una IA describe, las capturas van a ella: al proveedor de la API, al chat en el navegador o a la herramienta instalada. Con Ollama o LM Studio quedan en tu computadora."],
  padH: "Tus valores predeterminados y el idioma",

  cfgMenuH: "El menú de valores",
  cfgMenuP: "<code>npx screendocs config</code> abre una lista con cada configuración y su valor actual. Elige una, cámbiala y repite hasta elegir Listo. Los valores en gris son los predeterminados de ScreenDocs.",
  cfgCmdH: "Desde la terminal, sin el menú",
  cfgCmds: [["config list", "muestra lo que está guardado"], ["config set maxPages 40", "guarda un valor"], ["config unset maxPages", "vuelve un valor al predeterminado"], ["config reset", "borra todo (el idioma se pregunta de nuevo)"], ["config path", "muestra dónde está el archivo"]],
  langH: "Dos idiomas distintos",
  langP: "<b>El idioma de la terminal</b> es el que ScreenDocs usa para hablarte. Solo lo pregunta la primera vez que lo ejecutas y luego queda guardado. Para cambiarlo, ejecuta <code>npx screendocs config</code> y elige <i>Idioma de screendocs</i>; vale para todas las próximas veces.<br><br><b>El idioma de las descripciones</b> es el que usa la IA para escribir. Es el que el menú pregunta cada vez. Si no eliges uno, es el mismo de la terminal. Para cambiarlo solo una vez, agrega <code>--lang en</code> al comando; para siempre, elige <i>Idioma de las descripciones</i> en el mismo menú.",
  tipNone: "<b>Una vez sin IA.</b> Si guardaste una IA en tus valores, se usa en cada ejecución. Para que una vez salgan solo las capturas, agrega <code>--describe none</code> al comando. La próxima vez, la IA vuelve.", layH: "Qué vale más: piensa en capas", layP: "Una opción puede venir de cuatro lugares, uno encima del otro. Cuando dos dicen cosas distintas, vale el de arriba.", layers: [["El comando", "Lo que escribes ahora. Vale solo esta vez.", "--max-pages 5", "5"], ["Opciones de la carpeta (opcional)", "Un <code>screendocs.config.json</code> en la carpeta donde lo ejecutas. Vale solo ahí.", "\"maxPages\": 10", "10"], ["Tus valores", "Lo que guardaste con <code>npx screendocs config</code>. Vale en cualquier carpeta.", "config set maxPages 40", "40"], ["Valor de ScreenDocs", "Lo que ya viene en el paquete.", "", "20"]], layEx: "<b>Ejemplo con el número de páginas.</b> En cualquier carpeta busca 40, porque guardaste 40. En la carpeta <code>cliente-x</code>, que tiene un archivo que dice 10, busca 10. Si ahí escribes <code>--max-pages 5</code>, busca 5, solo esta vez.", layTip: "En la práctica, casi todos usan solo dos capas: guardan lo que quieren siempre con <code>npx screendocs config</code> y cambian una vez con una flag en el comando.", filesH: "Lo que queda en tu computadora", runH: "En la carpeta donde ejecutas el comando", run: [["screendocs-output/", "Las capturas, los videos y el informe, una carpeta por sitio. Es lo único que ScreenDocs crea aquí."]], homeH: "En tu carpeta de usuario", home: [["Tus valores", "Todo lo que guardaste con <code>npx screendocs config</code>, el idioma incluido. <code>npx screendocs config path</code> muestra dónde."], ["Inicios de sesión", "Un archivo por sitio, guardado por <code>npx screendocs login</code>. Nunca los compartas."], ["Claves de API", "Solo si elegiste guardar una, y solo cuando el sistema no tiene almacén de contraseñas. Mira <a href=\"#seguranca\">Seguridad</a>."]], filesNote: "ScreenDocs nunca crea <code>screendocs.config.json</code>. Solo lee ese archivo, si creas uno.", devH: "¿Lo vas a ejecutar desde el código de GitHub?", devP: "Este manual es para quien lo usa desde npm. Para descargar el código de GitHub, ejecutar ScreenDocs desde él o mandar una corrección, mira la <a href=\"https://github.com/RuBeNsMoTa13/screendocs/blob/main/CONTRIBUTING.es.md\">guía para desarrolladores</a>.",
  mapH: "Cómo se mapea el sitio",
  mapP: "De la dirección al informe, ScreenDocs pasa por estas etapas. Buscar las páginas y cortarlas en secciones es lo que decide qué entra en el informe.",
  flow: [
    ["Comprueba la dirección", "Verifica que el sitio responda y sugiere correcciones."],

  ],
  bfsH: "1. Buscando las páginas",
  bfsP: "Abre la página de inicio (nivel 0), junta todos sus enlaces y visita cada uno (nivel 1), luego los enlaces de esos (nivel 2), y así sigue. Esto se llama búsqueda en anchura: las páginas más cercanas al inicio entran primero. Se detiene cuando llega a <code>--max-pages</code> páginas (20) o cuando no quedan enlaces hasta el nivel <code>--depth</code> (3). Los enlaces hallados en el último nivel no se siguen.",

    "<b>Sin pantallas repetidas:</b> las partes de la ruta que son números o códigos largos se vuelven <code>:id</code>, así que <code>/blog/12</code> y <code>/blog/13</code> cuentan como una sola pantalla.",

/* The example crawl, the same in every language; the reason keys point into u.why */
const WORDS = {
  pt: { about: "sobre", menu: "cardapio", dash: "painel", acc: "conta", cfg: "config", rep: "relatorios", out: "sair" },
  en: { about: "about", menu: "menu", dash: "dashboard", acc: "account", cfg: "settings", rep: "reports", out: "logout" },
  es: { about: "nosotros", menu: "menu", dash: "panel", acc: "cuenta", cfg: "ajustes", rep: "informes", out: "logout" },
};
const CRAWL = (site, w) => [
  [[`/`, OK]],
  [[`/${w.about}`, OK], [`/blog`, OK], [`/login`, OK], [`/blog?page=2`, SAME, "query"], [`/${w.out}`, NO, "logout"], [`/${w.menu}.pdf`, NO, "file"], [`instagram.com/...`, NO, "other"], [`app.${site}`, NO, "sub"]],
  [[`/blog/12`, OK, "id"], [`/blog/13`, SAME, "sameId"], [`/${w.dash}`, OK, "login"], [`/${w.acc}`, SAME, "redirect"], [`/admin`, NO, "excl"]],
  [[`/${w.dash}/${w.cfg}`, OK, "noFollow"], [`/${w.dash}/${w.rep}`, OK, "noFollow"]],
];

function mapSection(u, site, lang) {
  const mark = { ok: "✓", same: "=", no: "✕" };
  const levels = CRAWL(site, WORDS[lang]).map((nodes, i, all) => `
    <div class="lvl">
      <div class="lvl-h">${u.lvl(i, i === all.length - 1)}</div>
      ${nodes.map(([p, s, w]) => `<div class="node ${s}"><span class="m">${mark[s]}</span><span class="p">${p}</span>${w ? `<span class="w">${u.why[w]}</span>` : ""}</div>`).join("")}
    </div>`).join("");
  const page = (labels, sliced) => `
    <div class="mock">
      <div class="mock-h">${sliced ? u.noBlocks : u.withBlocks}</div>
      <div class="browser"><div class="bar3"><i></i><i></i><i></i></div>
        ${labels.map((l, i) => `<div class="blk ${sliced ? "sl" : ""}" style="height:${sliced ? 62 : [34, 70, 56, 52, 30][i]}px"><span>${l}</span><b>${String(i + 1).padStart(2, "0")}.jpg</b></div>`).join("")}
      </div>
    </div>`;
  return `
    <section class="part" id="mapa">
      <h2>${u.mapH}</h2>
      <p class="intro">${u.mapP}</p>
      <ol class="flow">${u.flow.map(([t, d], i) => `<li class="${i === 2 || i === 3 ? "hot" : ""}"><b>${t}</b><span>${d}</span></li>`).join("")}</ol>

      <h3 class="sub">${u.bfsH}</h3>
      <p>${u.bfsP}</p>
      <div class="legend">${u.legend.map(([k, t]) => `<span class="node ${k}"><span class="m">${mark[k]}</span>${t}</span>`).join("")}</div>
      <div class="crawl" role="img" aria-label="${u.bfsH}">${levels}</div>
      <p class="cap"><code>npx screendocs ${site} --exclude /admin</code></p>
      <div class="card rules"><h3>${u.rulesH}</h3><ul>${u.rules.map((r) => `<li>${r}</li>`).join("")}</ul></div>

      <h3 class="sub">${u.cutH}</h3>
      <p>${u.cutP}</p>
      <div class="cut">
        ${page(u.blocks, false)}
        ${page([1, 2, 3, 4].map((n) => `${u.slice} ${n}`), true)}
        <ul class="cutrules">${u.cutRules.map((r) => `<li>${r}</li>`).join("")}</ul>
      </div>
    </section>`;
}

      ${u.groups.map(([g, items]) => `

        </div>
      </div>
    </section>`;
}

  return {
    banner: frame([
      `<span class="r">${SMALL}</span>`,
      `<span class="d">  ${c.tagline}</span>`,
      `  <span class="d">${c.by}</span> <span class="w">Rubens Mota</span>  <span class="r">https://github.com/RuBeNsMoTa13</span>`,

    ]),
    screens: frame([

      `${B}  3. ${c.s3}`,
      B,
      `<span class="r">◆</span>  ${c.got}`,
    ]),
    pick: frame([
      active(c.pickCap),
      opt(`${site}  <span class="d">16/10/2026 14:02 · 30 ${c.screens}</span>`, true),
      opt(`blog.${site}  <span class="d">15/10/2026 21:40 · 12 ${c.screens}</span>`, false),
      end(h.sel),
    ]),
  };
}

const cmd = (t, u) => `<div class="cmd"><span class="t">${t}</span><button type="button" class="copy" data-copy="${t.replace(/"/g, "&quot;")}">${u.copy}</button></div>`;

function render(lang) {
  const { c, u } = L[lang];
  const site = lang === "pt" ? "meusite.com.br" : lang === "es" ? "misitio.com" : "mysite.com";
  const f = frames(c, site, lang);
  const ids = ["comecar", "jeitos", "menu", "teclas", "descrever", "comandos", "opcoes", "resultado"];
  const toc = ids.map((id, i) => [id, id === "opcoes" ? u.flagsH : u.toc[i]]);
  toc.splice(2, 0, ["mapa", u.mapH]);
  toc.splice(toc.findIndex(([id]) => id === "opcoes"), 0, ["padroes", u.padH], ["seguranca", u.secH]);
  const order = [
    ["firstrun", u.only.first], ["banner"], ["url"], ["urlFail"], ["login"], ["screens"], ["mode"], ["limit", u.only.disc], ["mask"], ["out"],
    ["describe"], ["api", u.only.api], ["lang"], ["focus", u.only.ai], ["advanced"], ["previous", u.only.prev], ["start"], ["run"],
  ];
  const step = ([k, when], i) => `
    <div class="step">
      <div><div class="n">${String(i + 1).padStart(2, "0")}</div><h3>${u.steps[k][0]}</h3>${when ? `<span class="when">${when}</span>` : ""}<p>${u.steps[k][1]}</p></div>
      <div style="min-width:0">${f[k]}</div>
    </div>`;
  return `
  <div class="wrap">
    <div class="hero">
      <div>
        <div class="eyebrow">${u.eyebrow}</div>
        <h1>${u.h1}</h1>
        <p class="lead">${u.lead}</p>
        ${u.notice ? `<p class="notice">${u.notice}</p>` : ""}
      </div>
      <div style="min-width:0">${f.banner}</div>
    </div>
    <div class="layout">
      <nav class="toc" aria-label="${u.eyebrow}"><ol>${toc.map(([id, t]) => `<li><a href="#${id}">${t}</a></li>`).join("")}</ol></nav>
      <div>
        <section class="part" id="comecar">
          <h2>${u.s1h}</h2>
          ${u.s1p.map((x) => `<p>${x}</p>`).join("")}
        </section>

        <section class="part" id="jeitos">
          <h2>${u.s2h}</h2>
          <p class="intro">${u.s2p}</p>
          <div class="two">
            <div class="card"><span class="tag">1</span><h3>${u.menuT}</h3>${cmd("npx screendocs", u)}<p>${u.menuP}</p></div>
            <div class="card"><span class="tag">2</span><h3>${u.directT}</h3>${cmd(`npx screendocs ${site}`, u)}<p>${u.directP}</p></div>
          </div>
        </section>

        ${mapSection(u, site, lang)}

        <section class="part" id="menu">
          <h2>${u.s3h}</h2>
          <p class="intro">${u.s3p}</p>
          ${order.map(step).join("")}
        </section>

        <section class="part" id="teclas">
          <h2>${u.s4h}</h2>
          <p class="intro">${u.s4p}</p>
          <div class="keys">${u.keys.map(([k, d]) => `<div><kbd>${k}</kbd><br>${d}</div>`).join("")}</div>
        </section>

        <section class="part" id="descrever">
          <h2>${u.s5h}</h2>
          <p class="intro">${u.s5p}</p>
          <div class="opts">${u.ways.map(([t, d, k]) => `<div class="card"><h3>${t}</h3><p>${d}</p><code>${k}</code></div>`).join("")}</div>
          <div class="step" style="border-top:0;margin-top:12px">
            <div><h3>${u.chatH}</h3><p>${u.chatP}</p>${cmd(`npx screendocs ${site} --describe chat`, u)}</div>
            <div style="min-width:0">${f.chat}</div>
          </div>
          <h3>${u.apiH}</h3>
          <p>${u.apiP}</p>
          ${cmd(`npx screendocs ${site} --model gemini/gemini-2.5-flash`, u)}
          ${cmd(`npx screendocs ${site} --model ollama/llama3.2-vision`, u)}
        </section>

        <section class="part" id="comandos">
          <h2>${u.s6h}</h2>
          <div class="two">
            <div class="card"><h3>${u.loginH}</h3>${cmd(`npx screendocs login ${site}`, u)}<p>${u.loginP}</p></div>
            <div class="card"><h3>${u.mcpH}</h3>${cmd("claude mcp add screendocs -- npx -y screendocs mcp", u)}<p>${u.mcpP}</p></div>
          </div>
          <div class="step" style="margin-top:12px">
            <div><h3>${u.descH}</h3>${cmd(`npx screendocs describe ${site}`, u)}<p>${u.descP}</p></div>
            <div style="min-width:0">${f.pick}</div>
          </div>
          <div class="two" style="margin-top:12px">
            <div class="card"><h3>${u.keysH}</h3>${cmd("npx screendocs keys set gemini", u)}<p>${u.keysP}</p></div>
            <div class="card"><h3>${u.helpH}</h3><p>${u.helpP}</p></div>
          </div>
        </section>

        ${configSection(u, f)}

        ${securitySection(u)}

        ${flagsSection(u, site)}

        <section class="part" id="resultado">
          <h2>${u.s8h}</h2>
          <p class="intro">${u.s8p}</p>
          <div class="tree">${frame([
            `<span class="w">screendocs-output/${site}/</span>`,
            ...u.tree.map(([n, d], i) => `${i === u.tree.length - 1 ? "└──" : "├──"} <span class="f">${n.replace(/</g, "&lt;")}</span>${" ".repeat(Math.max(2, 22 - n.length))}<span class="d">${d}</span>`),
          ])}</div>
        </section>
      </div>
    </div>
  </div>
  <footer><div class="wrap">${u.foot} <a href="https://github.com/RuBeNsMoTa13/screendocs" style="color:var(--accent)">github.com/RuBeNsMoTa13/screendocs</a></div></footer>`;
}

/* ---------- language switch: remembered per viewer, otherwise the browser's language ---------- */
function pickInitial() {
  try { const s = localStorage.getItem("sd-manual-lang"); if (L[s]) return s; } catch (e) {}
  const n = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return L[n] ? n : "pt";
}
function setLang(lang) {
  document.getElementById("app").innerHTML = render(lang);
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("sd-manual-lang", lang); } catch (e) {}
}
document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const lang = document.querySelector('.langs button[aria-pressed="true"]').dataset.lang;
  const done = () => { btn.textContent = L[lang].u.copied; setTimeout(() => (btn.textContent = L[lang].u.copy), 1400); };
  const text = btn.dataset.copy;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
});
setLang(pickInitial());
</script>

</html>
